name: OpenCode
options:
  bundleIdPrefix: com.anemos
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/whisperkit
    from: 0.18.0

targets:
  OpenCode:
    type: application
    platform: iOS
    sources:
      - path: OpenCode
      - path: WebAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anemos.app
        INFOPLIST_FILE: OpenCode/Info.plist
        PRODUCT_NAME: Anemos
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  OpenCode:
    build:
      targets:
        OpenCode: all
    run:
      config: Release
    archive:
      config: Release
