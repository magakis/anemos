<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Select Anemos interface</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        background: #171515;
        color: #f8f7f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #302929 0, #171515 58%);
      }

      main {
        width: min(100%, 560px);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 8vw, 42px);
        letter-spacing: -0.04em;
      }

      p {
        margin: 10px 0 24px;
        color: #b9b0b0;
        font-size: 15px;
      }

      .cards {
        display: grid;
        gap: 12px;
      }

      .card {
        width: 100%;
        border: 1px solid #4a4141;
        border-radius: 18px;
        padding: 18px 20px;
        color: inherit;
        background: #211d1d;
        text-align: left;
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
      }

      .card-action {
        display: block;
        width: 100%;
        border: 0;
        padding: 0;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .card:active:not(:disabled) {
        transform: scale(0.985);
      }

      .card:hover:not(:disabled),
      .card.selected {
        border-color: #e9c46a;
        background: #2b2520;
      }

      .card:focus-visible {
        outline: 3px solid #85c7d9;
        outline-offset: 3px;
      }

      .card-action:focus-visible {
        outline: 3px solid #85c7d9;
        outline-offset: 3px;
      }

      .card:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .name {
        display: block;
        font-size: 18px;
        font-weight: 650;
      }

      .server {
        display: block;
        overflow: hidden;
        margin-top: 7px;
        color: #b9b0b0;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .state {
        display: block;
        min-height: 20px;
        margin-top: 20px;
        color: #b9b0b0;
        font-size: 13px;
      }

      .url-label {
        display: block;
        margin-top: 18px;
        color: #d9d2d2;
        font-size: 13px;
        font-weight: 600;
      }

      .url-input {
        width: 100%;
        margin-top: 7px;
        border: 1px solid #4a4141;
        border-radius: 10px;
        padding: 10px 12px;
        color: #f8f7f7;
        background: #171515;
        font: inherit;
        font-size: 14px;
      }

      .url-input:focus-visible {
        outline: 3px solid #85c7d9;
        outline-offset: 2px;
      }

      .hint,
      .probe {
        display: block;
        margin-top: 7px;
        color: #b9b0b0;
        font-size: 12px;
      }

      .probe.ok {
        color: #a9d7a9;
      }

      .probe.unreachable,
      .hint.error {
        color: #f39a9a;
      }

      .error {
        color: #f39a9a;
      }

      .gesture-hint {
        margin: 20px 0 0;
        color: #817777;
        font-size: 12px;
        line-height: 1.45;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Select interface</h1>
        <p>Choose the Anemos experience to open next time.</p>
        <div class="cards" role="list" aria-label="Anemos interfaces">
          <button class="card" data-ui="3" data-select="3" type="button" role="listitem">
            <span class="name">Anemos Chamber</span>
            <span class="server" data-server="3">Classic / Anemos Chamber → loading…</span>
          </button>
          <button class="card" data-ui="2" data-select="2" type="button" role="listitem">
            <span class="name">Classic</span>
            <span class="server" data-server="2">Classic / Anemos Chamber → loading…</span>
          </button>
          <div class="card" data-ui="1" role="listitem">
            <button class="card-action" data-select="1" type="button">
              <span class="name">Chamber Full</span>
              <span class="server" id="chamber-server-label">Chamber Full → not configured</span>
            </button>
            <label class="url-label" for="chamber-url">Chamber server URL</label>
            <input
              class="url-input"
              id="chamber-url"
              type="url"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://chamber.example.com"
            />
            <span class="hint" id="chamber-hint" role="status" aria-live="polite">HTTPS is preferred. HTTP is limited to local and Tailscale addresses.</span>
            <span class="probe" id="chamber-probe" role="status" aria-live="polite">Not checked</span>
          </div>
        </div>
        <span class="state" id="state" role="status" aria-live="polite"></span>
        <footer class="gesture-hint">Switch anytime: swipe up with four fingers (or double-tap with four fingers) in any interface to return here.</footer>
    </main>
    <script>
      (() => {
        const pending = new Map();
        let counter = 0;

        const commandNames = {
          getChamberServerUrl: "get_chamber_server_url",
          getDefaultServerUrl: "get_default_server_url",
          getSelectedUI: "get_selected_ui",
          probeChamberServerUrl: "probe_chamber_server_url",
          selectUI: "select_ui",
          setChamberServerUrl: "set_chamber_server_url",
        };

        const unwrap = (value, key) => {
          if (value && typeof value === "object" && key in value) return value[key];
          return value;
        };

        const installWebKitResponseHandler = () => {
          if (!window.webkit?.messageHandlers?.opencode?.postMessage) return false;
          window.__OPENCODE_BRIDGE__ = {
            onResponse: (id, result, error) => {
              const request = pending.get(id);
              if (!request) return;
              pending.delete(id);
              if (error) request.reject(new Error(error));
              else request.resolve(result);
            },
            onEvent: () => {},
          };
          return true;
        };

        const call = (method, params = {}) => {
          const tauriInvoke = window.__TAURI_INTERNALS__?.invoke;
          if (typeof tauriInvoke === "function") {
            return tauriInvoke(`plugin:mobile-bridge|${commandNames[method]}`, params);
          }

          if (!installWebKitResponseHandler()) return Promise.resolve(null);
          const id = `selector:${Date.now()}:${counter++}`;
          return new Promise((resolve, reject) => {
            pending.set(id, { resolve, reject });
            try {
              window.webkit.messageHandlers.opencode.postMessage({ id, method, params });
            } catch (error) {
              pending.delete(id);
              reject(error);
            }
          });
        };

        const cards = [...document.querySelectorAll("[data-ui]")];
        const selectors = [...document.querySelectorAll("[data-select]")];
        const state = document.getElementById("state");
        const chamberUrl = document.getElementById("chamber-url");
        const chamberHint = document.getElementById("chamber-hint");
        const chamberProbe = document.getElementById("chamber-probe");
        const chamberServerLabel = document.getElementById("chamber-server-label");
        let probeGeneration = 0;

        const setState = (text, isError = false) => {
          state.textContent = text;
          state.classList.toggle("error", isError);
        };

        const setChamberHint = (text, isError = false) => {
          chamberHint.textContent = text;
          chamberHint.classList.toggle("error", isError);
        };

        const setChamberProbe = (text, kind = "") => {
          chamberProbe.textContent = text;
          chamberProbe.className = `probe${kind ? ` ${kind}` : ""}`;
        };

        const parseChamberUrl = (value) => {
          const input = value.trim();
          if (!input) return { error: "Enter a valid http:// or https:// URL." };
          let url;
          try {
            url = new URL(input);
          } catch {
            return { error: "Enter a valid http:// or https:// URL." };
          }
          if (!url.hostname || url.username || url.password || (url.port && (Number(url.port) < 1 || Number(url.port) > 65535))) {
            return { error: "Enter a valid http:// or https:// URL." };
          }
          if (url.protocol === "https:") return { url: url.href, secure: true };
          if (url.protocol === "http:") return { url: url.href, secure: false };
          return { error: "Enter a valid http:// or https:// URL." };
        };

        const updateChamberUrlState = () => {
          chamberServerLabel.textContent = `Chamber Full → ${chamberUrl.value.trim() || "not configured"}`;
          const parsed = parseChamberUrl(chamberUrl.value);
          if (parsed.error) {
            setChamberHint(parsed.error, true);
            setChamberProbe("Not checked");
            return parsed;
          }
          setChamberHint(parsed.secure ? "HTTPS connection." : "Unencrypted LAN connection.");
          setChamberProbe("Not checked");
          return parsed;
        };

        const persistChamberUrl = async () => {
          const parsed = updateChamberUrlState();
          if (!chamberUrl.value.trim()) {
            try {
              await call("setChamberServerUrl", { url: null });
              return true;
            } catch {
              setState("Could not save the Chamber server URL.", true);
              return false;
            }
          }
          if (parsed.error) return false;
          try {
            await call("setChamberServerUrl", { url: parsed.url });
            return true;
          } catch {
            setState("Could not save the Chamber server URL.", true);
            return false;
          }
        };

        const probeChamberUrl = async () => {
          const parsed = updateChamberUrlState();
          if (parsed.error) return false;
          const generation = ++probeGeneration;
          setChamberProbe("Checking…");
          try {
            const result = unwrap(await call("probeChamberServerUrl", { url: parsed.url }), "reachable");
            if (generation !== probeGeneration) return false;
            if (result === true) {
              setChamberProbe("✓ Reachable", "ok");
              return true;
            }
          } catch {}
          if (generation === probeGeneration) setChamberProbe("Unreachable", "unreachable");
          return false;
        };

        const select = async (id) => {
          if (id !== "1" && id !== "2" && id !== "3") return;
          if (id === "1") {
            if (!(await persistChamberUrl()) || !(await probeChamberUrl())) {
              setState("Set a reachable Chamber server before opening Chamber Full.", true);
              return;
            }
          }
          setState("Opening…");
          try {
            await call("selectUI", { id });
            cards.forEach((card) => card.classList.toggle("selected", card.dataset.ui === id));
          } catch {
            setState("Could not save this selection.", true);
          }
        };

        selectors.forEach((selector) => {
          selector.addEventListener("click", () => void select(selector.dataset.select));
        });

        chamberUrl.addEventListener("input", updateChamberUrlState);
        chamberUrl.addEventListener("change", () => {
          void persistChamberUrl().then((saved) => {
            if (saved) void probeChamberUrl();
          });
        });

        const initialize = async () => {
          try {
            const selected = unwrap(await call("getSelectedUI"), "id");
            const remembered = selected === "1" || selected === "2" || selected === "3" ? selected : "2";
            cards.forEach((card) => card.classList.toggle("selected", card.dataset.ui === remembered));
          } catch {
            cards.find((card) => card.dataset.ui === "2")?.classList.add("selected");
          }

          try {
            const server = unwrap(await call("getDefaultServerUrl"), "url");
            const label = typeof server === "string" && server ? server : "Not configured";
            document.querySelectorAll("[data-server]").forEach((element) => {
              element.textContent = `Classic / Anemos Chamber → ${label}`;
            });
          } catch {
            document.querySelectorAll("[data-server]").forEach((element) => {
              element.textContent = "Classic / Anemos Chamber → Not configured";
            });
          }

          try {
            const server = unwrap(await call("getChamberServerUrl"), "url");
            chamberUrl.value = typeof server === "string" ? server : "";
            chamberServerLabel.textContent = `Chamber Full → ${chamberUrl.value || "not configured"}`;
            updateChamberUrlState();
            if (chamberUrl.value) void probeChamberUrl();
          } catch {
            chamberServerLabel.textContent = "Chamber Full → not configured";
          }
        };

        void initialize();
      })();
    </script>
  </body>
</html>
